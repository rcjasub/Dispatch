# Redis as a single-replica Deployment.
#
# Why not a StatefulSet? A StatefulSet gives a stable identity (redis-0) and a
# PersistentVolume that survives restarts. Here persistence is switched off on
# purpose (--save "" --appendonly no) so benchmarks measure the queue, not disk.
# Trade-off to state out loud: if this pod dies, every queued job is gone.
# Production: StatefulSet + AOF, or a managed Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gqueue
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
# Stable DNS name "redis" (redis.gqueue.svc) that workers connect to,
# no matter which IP the Redis pod gets.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gqueue
spec:
  selector: { app: redis }
  ports:
    - port: 6379
