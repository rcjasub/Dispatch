# Minimal in-cluster Prometheus that discovers worker pods through the
# Kubernetes API. Each pod is scraped separately, so per-pod throughput is
# visible while pods are added, killed, or autoscaled.
#
# UI:  kubectl -n gqueue port-forward svc/prometheus 9091:9090   -> http://localhost:9091
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: gqueue
---
# Prometheus needs to list pods to find scrape targets. A Role (not a
# ClusterRole) limits that permission to this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: gqueue
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: gqueue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: gqueue
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gqueue
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: gqueue-worker
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [gqueue] }
        relabel_configs:
          # keep only pods annotated prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          # scrape <pod IP>:<prometheus.io/port>
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gqueue
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: gqueue
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
